<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>声でメロディメモ</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--text:#1d1b18;--sub:#7a746a;--acc:#d9531e;--line:#e4dfd5;--note:#d9531e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--card:#211f18;--text:#f1ede4;--sub:#9d968a;--acc:#ff7a45;--line:#38352b;--note:#ff7a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16150f;--card:#211f18;--text:#f1ede4;--sub:#9d968a;--acc:#ff7a45;--line:#38352b;--note:#ff7a45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 32px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.big{font-size:84px;font-weight:700;text-align:center;line-height:1.1;min-height:92px}
.eng{text-align:center;color:var(--sub);font-size:16px;height:22px}
.meter{position:relative;height:10px;border-radius:5px;background:var(--line);margin:14px 8px 4px}
.meter i{position:absolute;top:-3px;left:50%;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--acc);transition:left .06s}
.meter b{position:absolute;left:50%;top:0;width:1px;height:10px;background:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;flex:1;min-width:0}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.rec{border-color:#d33;color:#d33}
button.rec.on{background:#d33;color:#fff}
button:disabled{opacity:.4;cursor:default}
label{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px}
canvas{width:100%;height:210px;display:block;border-radius:8px}
.seq{font-size:15px;line-height:1.8;word-break:break-all;min-height:28px}
.hint{font-size:12px;color:var(--sub);margin-top:8px}
h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.lv{position:relative;height:12px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}
.lv i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sub)}
.lv b{position:absolute;top:0;bottom:0;width:2px;background:var(--text)}
.badge{display:inline-block;font-size:13px;padding:4px 12px;border-radius:99px;background:var(--line);color:var(--sub)}
.card.hot{border-color:#2e9e5b;box-shadow:0 0 0 3px #2e9e5b44}
.card.hot .badge{background:#2e9e5b;color:#fff}
.st{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--sub)}
input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.ed{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ed.show{display:block}
.ed .info{font-size:14px;font-weight:600;margin-bottom:8px}
.eg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.eg button{padding:9px 2px;font-size:13px}
canvas{touch-action:none}
.card.full{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;border:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.full canvas{height:52vh;height:52dvh}
input[type=number],select{font:inherit;font-size:14px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}

#comp{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#comp.on{display:flex}
.cb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;font-size:13px}
.cb button{flex:none;padding:7px 10px;font-size:13px;border-radius:10px}
.cb label{margin:0;font-size:13px;gap:4px}
.cb input[type=number]{width:56px;padding:6px}
.cb select{padding:6px;font-size:13px}
#cscroll{flex:1;min-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
#cinner{position:relative;width:max-content}
#cinner canvas{display:block;touch-action:none}
#cchord{position:sticky;bottom:0;border-top:1px solid var(--line)}
#cph{position:absolute;top:0;bottom:0;width:2px;background:#2e9e5b;display:none;pointer-events:none}
#ckb{position:relative;height:84px;flex:none;margin-bottom:6px;user-select:none;touch-action:manipulation}
#ckb *{box-sizing:border-box}
#ckb b{position:absolute;top:0;bottom:0;border:1px solid var(--line);background:#fff;color:#555;font-size:10px;font-weight:400;padding-top:62px;text-align:center;border-radius:0 0 6px 6px}
#ckb i{position:absolute;top:0;height:55%;background:#222;border-radius:0 0 4px 4px;z-index:2}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hd h1{margin:0 0 4px}
.ver{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--card)}
</style>
</head>
<body>
<main>
<div class="hd"><h1>🎤 声でメロディメモ</h1><span class="ver"></span></div>
<p class="sub">声を音名に変換 → ピアノで鳴らす → 録音して残す</p>

<div class="card" id="c1">
  <div style="text-align:center;margin-bottom:6px"><span class="badge" id="badge">待機中</span></div>
  <div class="big" id="name">–</div>
  <div class="eng" id="eng">マイクをオンにして歌ってみてください</div>
  <div class="meter"><b></b><i id="needle"></i></div>
  <div class="lv"><i id="lvbar"></i><b id="thrmark"></b></div>
  <div class="st"><span>入力レベル(白い縦線を超えると反応)</span><span id="lvdb"></span></div>
  <label style="margin-top:8px">感度 <input type="range" id="sens" min="0" max="100" value="60"></label>
  <div class="row" style="margin-top:12px">
    <button class="p" id="mic">マイク開始</button>
    <button id="cal">ノイズ再測定</button>
  </div>
  <label><input type="checkbox" id="live" checked> 声に合わせてピアノを鳴らす(イヤホン推奨)</label>
</div>

<div class="card" id="c2">
  <h2>メロディ録音</h2>
  <div class="row" style="margin-bottom:8px"><button id="undo" disabled>↶ 元に戻す</button><button id="redo" disabled>↷ やり直し</button><button id="fs">⛶ 全画面</button></div>
  <label style="margin:0 0 8px">拡大 <input type="range" id="zoom" min="1" max="6" step="0.5" value="1"></label>
  <div id="rw" style="overflow-x:auto"><canvas id="roll"></canvas></div>
  <div class="seq" id="seq"></div>
  <div class="ed" id="ed"><div class="info" id="edinfo"></div><div class="eg" id="eg"></div></div>
  <div class="row" style="margin-top:10px">
    <button class="rec" id="rec" disabled>● 録音</button>
    <button id="play" disabled>▶ 再生</button>
    <button id="clear" disabled>消去</button>
  </div>
  <button id="tocomp" disabled style="margin-top:8px;width:100%">🎼 作曲モードへ(録音から音符を取り込む)</button>
  <div class="row" style="margin-top:12px;align-items:center">
    <label style="margin:0">BPM <input type="number" id="bpm" value="100" min="40" max="240" style="width:64px"></label>
    <select id="grid"><option value="1">1/4拍</option><option value="2" selected>1/8拍</option><option value="4">1/16拍</option></select>
    <button id="quant" disabled style="flex:2">拍に揃える</button>
  </div>
  <div class="row" style="margin-top:8px;align-items:center">
    <label style="margin:0">最短休符 <select id="minrest"><option value="8">32分</option><option value="4" selected>16分</option><option value="2">8分</option><option value="1">4分</option></select></label>
    <button id="rebuild" disabled style="flex:2">録音から作り直す</button>
  </div>
  <div class="row" style="margin-top:4px"><label style="margin:8px 0 0"><input type="checkbox" id="metro"> 録音中メトロノーム</label><label style="margin:8px 0 0"><input type="checkbox" id="snap" checked> ドラッグを拍に吸着</label><label style="margin:8px 0 0"><input type="checkbox" id="split" checked> 同じ高さの音を区切る</label></div>
  <h2 style="margin-top:16px">ミキサー <span id="vstat" style="font-weight:400">声データ: なし</span></h2>
  <div id="mix"></div>
  <div class="hint">録音中は仮の音符が表示され、停止すると音程の線から音符を作り直します。録音後、音符をドラッグすると上下で音程、左右で位置を動かせます(右端をドラッグで長さ)。細い線は、歌った声そのままの音程です。マイク開始後に使えます。スピーカーで鳴らすとピアノの音を拾うので、イヤホンがおすすめです。</div>
</div>
</main>
<div id="comp">
 <div class="cb"><button id="cback">← 録音に戻る</button><b>🎼 作曲モード</b><span class="ver" style="margin-left:auto"></span><button id="creimp">取り込み直し</button></div>
 <div class="cb"><label>BPM <input type="number" id="cbpm" min="40" max="240"></label><label>キー <select id="ckey"></select></label><label>拍 <select id="cgrid"><option value="1">1/4</option><option value="0.5">1/8</option><option value="0.25" selected>1/16</option></select></label><button id="cadd">＋小節</button><label><input type="checkbox" id="csnap" checked> 拍に吸着</label><label>拡大 <input type="range" id="czoom" min="20" max="120" value="44" style="width:90px"></label></div>
 <div class="cb"><button id="cq">拍に揃える</button><button id="csn">キーに寄せる</button><select id="cmode"><option value="s">コード:シンプル</option><option value="p" selected>ポップス</option><option value="7">7thあり</option></select><button id="csug">コード提案</button><button id="cun">↶</button><button id="cre">↷</button><button id="cdel">削除</button></div>
 <div id="cscroll"><div id="cinner"><canvas id="croll"></canvas><canvas id="cchord"></canvas><i id="cph"></i></div></div>
 <div class="cb" id="cpan"></div>
 <div class="cb"><button id="cdn">oct▼</button><button id="cup">oct▲</button><label><input type="checkbox" id="cinp"> 鍵盤で入力(点線の位置に追加)</label></div>
 <div id="ckb"></div>
 <div class="cb"><button class="p" id="cplay">▶ 再生</button><label><input type="checkbox" id="cloop"> ループ</label><label>小節 <input type="number" id="clb0" value="1" min="1"> – <input type="number" id="clb1" value="4" min="1"></label></div>
 <div class="cb"><label><input type="checkbox" id="cm" checked>メロディ</label><label><input type="checkbox" id="cc" checked>コード</label><label><input type="checkbox" id="cv">声</label><label><input type="checkbox" id="cmet">メトロ</label><select id="cstyle"><option value="b">和音</option><option value="a" selected>分散和音</option><option value="r">8ビート</option></select></div>
</div>

<script>
/* バージョン: 改良するたびにこの数字を1つ上げる */
const APP_VER=1;
const JP=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
const EN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const $=id=>document.getElementById(id);
document.querySelectorAll('.ver').forEach(e=>e.textContent='デモ版 ver'+APP_VER);
document.title='声でメロディメモ(デモ版 ver'+APP_VER+')';
let ctx,analyser,buf,running=false;
let cand=-1,candN=0,cur=-1,curStart=0,silentN=0;
let recording=false,recT0=0,notes=[],playing=false,sel=-1,thr=0.01,lay={},frozen=null,voiceBuf=null,mr=null,vchunks=[],contour=[],pSum=0,pN=0,lastV=0,lastBeat=-1,hist=[],redo=[],pk=0,vl=0,vlT=0;
const thrOf=v=>0.1*Math.pow(0.02,v/100);
const lvOf=r=>Math.max(0,Math.min(1,(20*Math.log10(r+1e-9)+60)/60));
function setSens(){thr=thrOf(+$('sens').value);$('thrmark').style.left=(lvOf(thr)*100)+'%'}

try{const s=localStorage.getItem('vp-notes');if(s)notes=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('vp-notes',JSON.stringify(notes))}catch(e){}};

/* ---------- ピアノ音 ---------- */
let pdest=null;
function piano(midi,when,dur,vol){
  const f=440*Math.pow(2,(midi-69)/12),t=when;
  const out=ctx.createGain(),lp=ctx.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=Math.min(8000,f*7);
  const len=Math.max(0.5,Math.min(2.2,dur+0.4));
  out.gain.setValueAtTime(0,t);
  out.gain.linearRampToValueAtTime(0.35*(vol==null?1:vol),t+0.006);
  out.gain.exponentialRampToValueAtTime(0.0008,t+len);
  [[1,1],[2,.5],[3,.28],[4,.14],[5,.07]].forEach(([m,g])=>{
    const o=ctx.createOscillator(),og=ctx.createGain();
    o.type='sine';o.frequency.value=f*m;og.gain.value=g;
    o.connect(og).connect(out);o.start(t);o.stop(t+len+0.05);
  });
  out.connect(lp).connect(pdest||ctx.destination);
}

/* ---------- ピッチ検出 (YIN) ---------- */
function yin(b0,sr){
  /* 約16kHzに間引いて計算量を約1/9に(処理落ち・遅延対策) */
  const dsf=Math.max(1,Math.round(sr/16000)),sr2=sr/dsf,W=Math.round(0.032*sr2),mx=Math.floor(sr2/65),L=(W+mx+2)*dsf;
  const src=b0.length>L?b0.subarray(b0.length-L):b0,n2=Math.floor(src.length/dsf),b=new Float32Array(n2);
  for(let i=0;i<n2;i++){let a=0;for(let k=0;k<dsf;k++)a+=src[i*dsf+k];b[i]=a/dsf}
  const minT=Math.floor(sr2/1000),maxT=Math.min(mx,b.length-W-1);
  const d=new Float32Array(maxT+1);
  for(let tau=1;tau<=maxT;tau++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+tau];s+=x*x}d[tau]=s}
  let run=0;d[0]=1;
  for(let tau=1;tau<=maxT;tau++){run+=d[tau];d[tau]=d[tau]*tau/(run||1)}
  for(let tau=minT;tau<maxT;tau++){
    if(d[tau]<0.2){
      while(tau+1<maxT&&d[tau+1]<d[tau])tau++;
      const a=d[tau-1],bb=d[tau],c=d[tau+1],den=a-2*bb+c;
      const sh=den?0.5*(a-c)/den:0;
      return sr2/(tau+sh);
    }
  }
  return -1;
}

/* ---------- 周囲ノイズの自動測定 ---------- */
let calib=null,nh=[],candF=0,candT=0,lastDraw=0,env=[];
function startCalib(){calib={v:[],end:performance.now()+1000};$('rec').disabled=true}
function autoThr(nz){
  const t=Math.max(0.003,Math.min(0.08,nz*3)),v=100*Math.log(t/0.1)/Math.log(0.02);
  $('sens').value=Math.round(Math.max(0,Math.min(100,v)));setSens();
  $('eng').textContent='歌ってみてください';$('rec').disabled=false;
}

/* ---------- ノート確定処理 ---------- */
function endNote(te){
  if(cur<0)return;
  if(recording&&curStart>=recT0-70){
    const dur=((te||lastV)-curStart)/1000,s0=Math.max(0,(curStart-recT0)/1000);
    const pv=notes[notes.length-1],gap=pv?s0-(pv.s+pv.d):9;
    if(dur>=0.05){
      if(pv&&dur<0.1&&gap<0.12&&(pv.m===cur||dur<0.07)){const add=Math.max(0,s0+dur-(pv.s+pv.d));pv.d+=add;pv.od+=add}
      else notes.push({m:cur,s:s0,d:dur,o:s0,od:dur,pf:pN?pSum/pN:cur});
    }
    draw();
  }
  cur=-1;
}
function startNote(m,t0){
  cur=m;curStart=t0!=null?t0:performance.now()-65;pSum=0;pN=0;pk=0;vl=1;vlT=0;
  if($('live').checked)piano(m,ctx.currentTime,0.6);
}
function loop(){
  if(!running)return;
  analyser.getFloatTimeDomainData(buf);
  let rms=0;for(let i=buf.length-1024;i<buf.length;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/1024);
  if(calib){
    calib.v.push(rms);
    $('badge').textContent='周囲の音を測定中…';$('eng').textContent='静かにしてください';
    $('lvbar').style.width=(lvOf(rms)*100)+'%';
    if(calib.end<=performance.now()){const a=calib.v.sort((x,y)=>x-y),nz=a[a.length>>1];calib=null;autoThr(nz)}
    requestAnimationFrame(loop);return;
  }
  const f=rms>(cur>=0?thr*0.6:thr)?yin(buf,ctx.sampleRate):-1;
  $('lvbar').style.width=(lvOf(rms)*100)+'%';
  $('lvbar').style.background=rms>thr?'var(--acc)':'var(--sub)';
  $('lvdb').textContent=(20*Math.log10(rms+1e-9)).toFixed(0)+' dB';
  $('c1').classList.toggle('hot',f>0);
  $('badge').textContent=f>0?'● 声を検出中':(rms>thr?'音を解析中…':'待機中');
  if(f>0){
    silentN=0;
    nh.push(69+12*Math.log2(f/440));if(nh.length>3)nh.shift();
    const n=[...nh].sort((a,b)=>a-b)[nh.length>>1];
    let m=Math.round(n);if(cur>=0&&Math.abs(n-cur)<0.65)m=cur;
    const cents=Math.max(-50,Math.min(50,(n-m)*100));
    $('name').textContent=JP[((m%12)+12)%12];
    $('eng').textContent=EN[((m%12)+12)%12]+(Math.floor(m/12)-1)+'  '+f.toFixed(1)+' Hz  ('+(cents>=0?'+':'')+cents.toFixed(0)+'¢)';
    $('needle').style.left=(50+cents)+'%';
    if(recording)contour.push([(performance.now()-recT0)/1000,n]);
    if(m===cur){pSum+=n;pN++}
    lastV=performance.now();
    const nowT=performance.now();
    if(candN>0&&Math.abs(n-candF)<0.6){candN++;candF+=(n-candF)/candN}else{candF=n;candN=1;candT=nowT}
    const cm=(cur>=0&&Math.abs(candF-cur)<0.65)?cur:Math.round(candF);
    const oj=cur>=0&&Math.abs(cm-cur)%12===0;
    if(candN>=(oj?3:2)&&nowT-candT>=(oj?55:30)&&cm!==cur){endNote(candT-25);startNote(cm,candT-25)}
    else if(cur>=0&&m===cur&&$('split').checked){
      const now=performance.now();
      if(rms>pk){pk=rms;vl=rms;vlT=now}else if(rms<vl){vl=rms;vlT=now}
      if(vl<pk*0.35&&rms>vl*2&&now-curStart>180){endNote(vlT);startNote(m);curStart=vlT;pk=rms;vl=rms}
    }
  }else{
    silentN++;
    if(performance.now()-lastV>100){cand=-1;candN=0;nh=[];endNote();$('name').textContent='–';$('eng').textContent='…';$('needle').style.left='50%'}
  }
  if(recording){env.push([(performance.now()-recT0)/1000,rms]);metro();const tn=performance.now();if(tn-lastDraw>66){lastDraw=tn;draw();$('rec').textContent='■ 停止 '+((tn-recT0)/1000).toFixed(1)+'秒'}}
  requestAnimationFrame(loop);
}

/* ---------- マイク ---------- */
function micOff(msg){
  running=false;calib=null;endNote();stopRec();
  if(ctx&&ctx.__stream){ctx.__stream.getTracks().forEach(t=>t.stop());ctx.__stream=null}
  $('mic').textContent='マイク開始';$('rec').disabled=true;
  $('name').textContent='–';$('eng').textContent=msg||'停止中';$('c1').classList.remove('hot');$('badge').textContent='待機中';$('lvbar').style.width='0';
}
$('mic').onclick=async()=>{
  if(running){micOff();return}
  try{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx.__stream=stream;
    analyser=ctx.createAnalyser();analyser.fftSize=4096;
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=60;hp.Q.value=0.7;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;lp.Q.value=0.7;
    ctx.createMediaStreamSource(stream).connect(hp);hp.connect(lp);lp.connect(analyser);
    buf=new Float32Array(analyser.fftSize);nh=[];
    running=true;$('mic').textContent='マイク停止';$('rec').disabled=false;

/* ---------- 隙間の判定: 休符にするか、前後の音符をつなぐか ---------- */
function smoothEnv(){
  const o=[];
  for(let i=0;i<env.length;i++){let s=0,c=0;for(let j=Math.max(0,i-1);j<=Math.min(env.length-1,i+1);j++){s+=env[j][1];c++}o.push([env[i][0],s/c])}
  return o;
}
function refine(infos,LAG){
  if(!infos.length||!env.length)return;
  const E=smoothEnv(),minRest=60/(+$('bpm').value||100)/(+$('minrest').value||4);
  const pkOf=(a,b)=>{let p=0;for(const [t,v] of E){if(t>b)break;if(t>=a&&v>p)p=v}return p};
  const setEnd=(n,e)=>{e=Math.max(n.s+0.05,e);n.d=e-n.s;n.od=n.d};
  infos.forEach((A,i)=>{
    const B=infos[i+1],pkA=pkOf(Math.max(A.t0,A.t1-0.3),A.t1),th=Math.max(0.25*pkA,thr*0.6);
    const w0=A.t1-0.15,w1=B?B.t0:A.t1+0.5;
    /* 音量が基準を下回っている最も長い区間を探す */
    let best=null,run=null;
    for(const [t,v] of E){
      if(t<w0)continue;if(t>w1)break;
      if(v<th){if(!run)run={s:t,e:t};else run.e=t;if(!best||run.e-run.s>best.e-best.s)best={s:run.s,e:run.e}}else run=null;
    }
    if(!B){if(best)setEnd(A.b,best.s-LAG);return}
    /* 休符: 音量が低い状態が最短休符以上続いた時だけ。音符の終わりは音量が下がった時刻 */
    if(best&&best.e-best.s+0.016>=minRest){setEnd(A.b,best.s-LAG);return}
    /* それ以外は声が続いているとみなして前後の音符をつなぐ。境界は音量が最小の点 */
    const g=B.t0-A.t1;let tb=(A.t1+B.t0)/2,mn=1e9;
    for(const [t,v] of E){if(t<A.t1+0.2*g)continue;if(t>A.t1+0.8*g)break;if(v<mn){mn=v;tb=t}}
    tb-=LAG;
    const a=A.b,b=B.a,pkB=pkOf(B.t0,B.t0+0.3),dip=mn<0.6*Math.min(pkA,pkB);
    if(a.m===b.m&&!($('split').checked&&dip)){
      const e=b.s+b.d;a.pf=(a.pf*a.d+b.pf*b.d)/(a.d+b.d);a.d=e-a.s;a.od=a.d;b.del=1;if(b===B.b)B.b=a;
    }else{
      setEnd(a,tb);const e=b.s+b.d;b.s=Math.min(b.s,a.s+a.d);b.o=b.s;b.d=e-b.s;b.od=b.d;
    }
  });
}

/* ---------- 録音後: 音程の線から音符を作り直す ---------- */
function buildNotes(){
  const LAG=0.02,pts=contour.filter(p=>p[1]>=21&&p[1]<=108);
  if(pts.length<3)return null;
  const segs=[];let cs=[pts[0]];
  for(let i=1;i<pts.length;i++){if(pts[i][0]-pts[i-1][0]>0.1){segs.push(cs);cs=[]}cs.push(pts[i])}
  segs.push(cs);
  const out=[],infos=[];
  segs.forEach(sg=>{
    const T=sg.length;if(T<3)return;const k0=out.length;
    const lo=Math.max(21,Math.floor(Math.min(...sg.map(p=>p[1])))-1),hi=Math.min(108,Math.ceil(Math.max(...sg.map(p=>p[1])))+1);
    const S=hi-lo+1,P=1.2,bp=[];let prev=new Float64Array(S);
    /* ビタビ: 全体を見て「音名を切り替えるコスト」と「線とのずれ」の合計が最小になる音名列を選ぶ */
    for(let t=0;t<T;t++){
      const n=sg[t][1],dt=t?sg[t][0]-sg[t-1][0]:(sg[1][0]-sg[0][0]),w=Math.min(3,Math.max(0.3,dt/0.0167));
      const cu=new Float64Array(S),bt=new Int16Array(S);let mi=0;
      if(t)for(let s=1;s<S;s++)if(prev[s]<prev[mi])mi=s;
      for(let s=0;s<S;s++){
        if(t){const sw=prev[mi]+P;if(prev[s]<=sw){cu[s]=prev[s];bt[s]=s}else{cu[s]=sw;bt[s]=mi}}
        const dd=n-(lo+s);cu[s]+=w*Math.min(2.25,dd*dd);
      }
      bp.push(bt);prev=cu;
    }
    let s=0;for(let k=1;k<S;k++)if(prev[k]<prev[s])s=k;
    const st=new Array(T);st[T-1]=s;for(let t=T-1;t>0;t--){s=bp[t][s];st[t-1]=s}
    let runs=[];
    for(let i=0;i<T;i++){const m=lo+st[i],r=runs[runs.length-1];if(r&&r.m===m)r.i1=i;else runs.push({m,i0:i,i1:i})}
    const t0f=r=>r.i0?(sg[r.i0-1][0]+sg[r.i0][0])/2-LAG:sg[0][0]-LAG,
          t1f=r=>r.i1<T-1?(sg[r.i1][0]+sg[r.i1+1][0])/2-LAG:sg[T-1][0]-LAG+0.02,
          du=r=>t1f(r)-t0f(r);
    /* 0.07秒未満の短い音は長いほうの隣に吸収 */
    while(runs.length>1){
      let k=0;for(let j=1;j<runs.length;j++)if(du(runs[j])<du(runs[k]))k=j;
      if(du(runs[k])>=0.07)break;
      const a=runs[k-1],b=runs[k+1],tg=!a?b:!b?a:(du(a)>=du(b)?a:b);
      tg.i0=Math.min(tg.i0,runs[k].i0);tg.i1=Math.max(tg.i1,runs[k].i1);runs.splice(k,1);
    }
    for(let k=runs.length-1;k>0;k--)if(runs[k].m===runs[k-1].m){runs[k-1].i1=runs[k].i1;runs.splice(k,1)}
    runs.forEach(r=>{
      const a=t0f(r),b=t1f(r);if(b-a<0.05)return;
      let cuts=[];
      if($('split').checked){
        let st0=a,pk=0,vl=1,vlT=0;
        for(const [te,rv] of env){
          const t=te-LAG;if(t<a)continue;if(t>b)break;
          if(rv>pk){pk=rv;vl=rv;vlT=t}else if(rv<vl){vl=rv;vlT=t}
          if(vl<pk*0.35&&rv>vl*2&&t-st0>0.18){cuts.push(vlT);st0=vlT;pk=rv;vl=rv;vlT=t}
        }

      }
      const ed=[a,...cuts,b];
      for(let j=0;j<ed.length-1;j++){
        const s0=Math.max(0,ed[j]),e0=ed[j+1];if(e0-s0<0.05)continue;
        let sum=0,c=0;for(let i=r.i0;i<=r.i1;i++){const t=sg[i][0]-LAG;if(t>=ed[j]&&t<e0){sum+=sg[i][1];c++}}
        out.push({m:r.m,s:s0,d:e0-s0,o:s0,od:e0-s0,pf:c?sum/c:r.m});
      }
    });
    if(out.length>k0)infos.push({a:out[k0],b:out[out.length-1],t0:sg[0][0],t1:sg[T-1][0]});
  });

}

  $('mix').insertAdjacentHTML('beforeend','<label><input type="checkbox" id="t'+i+'"'+(c?' checked':'')+'> <span style="min-width:118px">'+t+'</span><input type="range" id="v'+i+'" min="0" max="100" value="'+v+'"></label>');
});
const vol=i=>$('t'+i).checked?(+$('v'+i).value/100):0;
const rd=(x,p)=>{const i=Math.floor(p);if(i<0||i+1>=x.length)return 0;const f=p-i;return x[i]*(1-f)+x[i+1]*f};
/* 声全体を連続して再構成: 音符部分は時間を保ったまま音程だけ補正、音符の間は元の声をつなぐ */
function renderVoice(){
  const x=voiceBuf.getChannelData(0),sr=ctx.sampleRate,W=Math.floor(0.06*sr),F=Math.floor(0.008*sr);
  const segs=[],E=0.12,ns=notes.filter(n=>n.pf!=null).sort((a,b)=>a.s-b.s);let ps=0,pd=0;
  const ext=(i,side)=>{
    const n=ns[i],m=side<0?ns[i-1]:ns[i+1],k=m?2:1;
    const gs=side<0?n.o-(m?m.o+m.od:0):(m?m.o:voiceBuf.duration)-(n.o+n.od);
    const gd=side<0?n.s-(m?m.s+m.d:0):(m?m.s:1e9)-(n.s+n.d);
    return Math.max(0,Math.min(E,gs/k,gd/k));
  };
  ns.forEach((n,i)=>{
    const e1=ext(i,-1),e2=ext(i,1);
    if(n.o-e1>ps&&n.s-e1>pd)segs.push({ss:ps,sd:n.o-e1-ps,ds:pd,dd:n.s-e1-pd,r:1});
    segs.push({ss:n.o-e1,sd:n.od+e1+e2,ds:n.s-e1,dd:n.d+e1+e2,r:Math.pow(2,(n.m-n.pf)/12)});
    ps=n.o+n.od+e2;pd=n.s+n.d+e2;
  });
  if(voiceBuf.duration>ps)segs.push({ss:ps,sd:voiceBuf.duration-ps,ds:pd,dd:voiceBuf.duration-ps,r:1});
  if(!segs.length)return voiceBuf;
  const end=Math.max(...segs.map(g=>g.ds+g.dd)),out=new Float32Array(Math.ceil((end+0.1)*sr));
  segs.forEach(g=>{
    const tr=Math.max(0.25,Math.min(4,g.sd/g.dd)),a=Math.round(g.ds*sr),n=Math.round(g.dd*sr),s0=g.ss*sr,k=(g.r-tr)/W;
    for(let j=-F;j<n+F;j++){
      const o=a+j;if(o<0||o>=out.length)continue;
      const ph=((j*k)%1+1)%1,ph2=(ph+0.5)%1,w1=0.5-0.5*Math.cos(2*Math.PI*ph),p=s0+j*tr;
      let e=1;
      if(j<F)e=0.5-0.5*Math.cos(Math.PI*(j+F)/(2*F));
      if(j>=n-F)e*=0.5+0.5*Math.cos(Math.PI*(j-n+F)/(2*F));
      out[o]+=e*(w1*rd(x,p+(ph-0.5)*W)+(1-w1)*rd(x,p+(ph2-0.5)*W));
    }
  });
  const vb=ctx.createBuffer(1,out.length,sr);vb.copyToChannel(out,0);return vb;
}
function playAll(t0){
  let end=0;const vp=vol(0),vv=vol(1),vo=vol(2);
  notes.forEach(n=>{
    end=Math.max(end,n.s+n.d);
    if(vp>0)piano(n.m,t0+n.s,n.d,vp);
    if(false){
      const r=Math.pow(2,(n.m-n.pf)/12),d=Math.min(n.d,n.od/r),a=t0+n.s,s=ctx.createBufferSource(),g=ctx.createGain();
      s.buffer=voiceBuf;s.playbackRate.value=r;
      g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(vv,a+0.01);g.gain.setValueAtTime(vv,a+Math.max(0.01,d-0.02));g.gain.linearRampToValueAtTime(0,a+d);
      s.connect(g).connect(ctx.destination);s.start(a,Math.max(0,n.o),d*r);
    }
  });
  if(vv>0&&voiceBuf){const vb=renderVoice(),s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=vb;g.gain.value=vv;s.connect(g).connect(ctx.destination);s.start(t0);end=Math.max(end,vb.duration)}
  if(vo>0&&voiceBuf){const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=voiceBuf;g.gain.value=vo;s.connect(g).connect(ctx.destination);s.start(t0);end=Math.max(end,voiceBuf.duration)}
  return end;
}
draw();ui();
</script>
<script>
/* ===== 作曲モード(第1段階) ===== */
const MAJS=[0,2,4,5,7,9,11],MINS=[0,2,3,5,7,8,10],QI={'':[0,4,7],m:[0,3,7],dim:[0,3,6],'7':[0,4,7,10],m7:[0,3,7,10],M7:[0,4,7,11],sus4:[0,5,7]};
const Q3=[['','m','m','','','m','dim'],['m','dim','','m','','','']],Q7=[['M7','m7','m7','M7','7','m7','dim'],['m7','dim','M7','m7','7','M7','7']];
const PK=[[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],[6.33,2.68,3.52,5.38,2.6,3.53,2.54,4.75,3.98,2.69,3.34,3.17]];
const HI=96,LO=36,RH=14;
const C={cn:[],ch:[],bars:4,bpm:100,vbpm:100,g:.25,nl:1,t:0,mn:0,sel:-1,cs:-1,cur:0,hist:[],redo:[],px:44,kb:60};
let P=null,cbus=null,dg=null;
const SC=$('cscroll'),RL=$('croll');
const cname=c=>c?EN[c.r]+c.q:'–';
const csave=()=>{try{localStorage.setItem('vp-comp',JSON.stringify({cn:C.cn,ch:C.ch,bars:C.bars,bpm:C.bpm,vbpm:C.vbpm,t:C.t,mn:C.mn}))}catch(e){}};
try{const s=JSON.parse(localStorage.getItem('vp-comp'));if(s&&s.cn)Object.assign(C,s)}catch(e){}
const snap=()=>JSON.stringify({cn:C.cn,ch:C.ch,bars:C.bars});
function ph(){C.hist.push(snap());if(C.hist.length>60)C.hist.shift();C.redo=[]}
function rest(s){const o=JSON.parse(s);C.cn=o.cn;C.ch=o.ch;C.bars=o.bars;C.sel=-1;cDraw();cPan();csave()}
function fix(){
  C.cn.sort((a,b)=>a.b-b.b);const o=[];
  for(const n of C.cn){const p=o[o.length-1];if(p&&n.b-p.b<1e-6)o.pop();const q=o[o.length-1];if(q&&q.b+q.l>n.b+1e-6)q.l=Math.max(.0625,n.b-q.b);o.push(n)}
  C.cn=o;const e=Math.max(0,...o.map(n=>n.b+n.l));C.bars=Math.max(C.bars,Math.ceil(e/4)||1);
  while(C.ch.length<C.bars)C.ch.push(null);
}
const scPc=()=>(C.mn?MINS:MAJS).map(x=>(x+C.t)%12);
const dia=(d,sev)=>({r:(C.t+(C.mn?MINS:MAJS)[d])%12,q:(sev?Q7:Q3)[C.mn][d]});
function corr(a,b){const n=a.length,ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n;let s=0,x=0,y=0;for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return s/Math.sqrt(x*y||1)}
function estKey(){
  const h=Array(12).fill(0);C.cn.forEach(n=>h[n.m%12]+=n.l);let best=-9;
  for(let k=0;k<2;k++)for(let t=0;t<12;t++){const r=corr(h,PK[k].map((_,i)=>PK[k][(i-t+12)%12]));if(r>best){best=r;C.t=t;C.mn=k}}
}
function suggest(){
  const mode=$('cmode').value,sev=mode==='7',degs=mode==='s'?[0,3,4]:mode==='p'?(C.mn?[0,2,3,4,5]:[0,1,3,4,5]):[0,1,2,3,4,5];
  const T={0:[3,4,5],4:[0,5],5:[3,1],3:[4,0,1],1:[4],2:[5,3]};let pd=-1;C.ch=[];
  for(let b=0;b<C.bars;b++){
    const w=Array(12).fill(0);C.cn.forEach(n=>{if(n.b>=b*4&&n.b<b*4+4)w[n.m%12]+=Math.min(n.l,b*4+4-n.b)+(n.b===b*4?.5:0)});
    if(!w.some(x=>x)){C.ch.push(pd<0?dia(0,sev):C.ch[b-1]);continue}
    let bs=-1e9,bd=0;
    degs.forEach(d=>{const c=dia(d,sev),tn=QI[c.q].map(i=>(c.r+i)%12);let s=0;for(let p=0;p<12;p++)s+=tn.includes(p)?w[p]:-.5*w[p];if(pd>=0&&(T[pd]||[]).includes(d))s+=.3;if(d===pd)s+=.1;if(s>bs){bs=s;bd=d}});
    pd=bd;C.ch.push(dia(bd,sev));
  }
}
function cImport(){
  C.bpm=C.vbpm=+$('bpm').value||100;const spb=60/C.bpm,g=C.g;
  const ir=1/32;C.cn=[...notes].sort((a,b)=>a.s-b.s).map(n=>({m:n.m,b:Math.round(n.s/spb/ir)*ir,l:Math.max(ir,Math.round(n.d/spb/ir)*ir)}));
  C.bars=2;C.ch=[];C.hist=[];C.redo=[];C.sel=C.cs=-1;C.cur=0;fix();estKey();suggest();cSync(1);
}
function cSync(center){
  $('cbpm').value=C.bpm;$('ckey').value=C.t*2+C.mn;$('cgrid').value=C.g;$('clb1').value=C.bars;
  $('cv').disabled=!voiceBuf||C.bpm!==C.vbpm;if($('cv').disabled)$('cv').checked=false;
  cDraw();cPan();csave();
  if(center&&C.cn.length){const a=C.cn.reduce((s,n)=>s+n.m,0)/C.cn.length;SC.scrollTop=(HI-a)*RH-SC.clientHeight/2;SC.scrollLeft=0}
}
function cDraw(){
  const W=C.bars*4*C.px,H=(HI-LO+1)*RH,d=window.devicePixelRatio||1,cs=getComputedStyle(document.documentElement),v=k=>cs.getPropertyValue(k).trim();
  const col=v('--note'),tx=v('--text'),ln=v('--line'),sb=v('--sub'),sc=scPc(),K=$('cchord');
  RL.width=W*d;RL.height=H*d;RL.style.width=W+'px';RL.style.height=H+'px';
  let g=RL.getContext('2d');g.scale(d,d);
  for(let m=LO;m<=HI;m++){const y=(HI-m)*RH,pc=m%12;g.fillStyle=sc.includes(pc)?'transparent':ln+'88';g.fillRect(0,y,W,RH);g.fillStyle=ln;g.fillRect(0,y+RH-.5,W,.5);if(!pc){g.fillStyle=sb;g.font='10px system-ui';g.fillText('C'+(m/12-1),2,y+RH-3)}}
  for(let b=0;b<=C.bars*4+1e-9;b+=C.g){g.globalAlpha=b%4===0?.6:b%1===0?.3:.12;g.fillStyle=sb;g.fillRect(b*C.px,0,1,H)}g.globalAlpha=1;
  C.cn.forEach((n,i)=>{
    const x=n.b*C.px,w=Math.max(4,n.l*C.px-1),y=(HI-n.m)*RH;
    g.fillStyle=col;g.beginPath();g.roundRect(x,y+1,w,RH-2,3);g.fill();
    if(!sc.includes(n.m%12)){g.strokeStyle='#d33';g.lineWidth=1.5;g.stroke()}
    if(i===C.sel){g.strokeStyle=tx;g.lineWidth=2;g.beginPath();g.roundRect(x,y+1,w,RH-2,3);g.stroke();g.fillStyle=tx;g.beginPath();g.roundRect(x-3,y-2,6,RH+4,3);g.roundRect(x+w-3,y-2,6,RH+4,3);g.fill()}
    if(w>20){g.fillStyle='#fff';g.font='bold 10px system-ui';g.fillText(JP[n.m%12],x+3,y+RH-3)}
  });
  g.strokeStyle=tx;g.globalAlpha=.5;g.lineWidth=1;g.setLineDash([4,3]);g.beginPath();g.moveTo(C.cur*C.px,0);g.lineTo(C.cur*C.px,H);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  K.width=W*d;K.height=34*d;K.style.width=W+'px';K.style.height='34px';g=K.getContext('2d');g.scale(d,d);
  g.fillStyle=v('--card');g.fillRect(0,0,W,34);
  for(let b=0;b<C.bars;b++){const x=b*4*C.px;if(b===C.cs){g.fillStyle=col;g.globalAlpha=.25;g.fillRect(x,0,4*C.px,34);g.globalAlpha=1}g.fillStyle=ln;g.fillRect(x,0,1,34);g.fillStyle=sb;g.font='9px system-ui';g.fillText(b+1,x+3,10);g.fillStyle=tx;g.font='bold 14px system-ui';g.fillText(cname(C.ch[b]),x+8,27)}
}
function cPan(){
  const p=$('cpan');p.innerHTML='';if(C.cs<0)return;const sev=$('cmode').value==='7';
  const add=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;p.appendChild(b)};
  p.insertAdjacentHTML('beforeend','<span>小節'+(C.cs+1)+'</span>');
  for(let d=0;d<7;d++){const c=dia(d,sev);add(cname(c),()=>{ph();C.ch[C.cs]=c;cDraw();cPan();csave()})}
  [['基本',''],['m','m'],['7','7'],['M7','M7'],['m7','m7'],['sus4','sus4'],['dim','dim']].forEach(([t,q])=>add(t,()=>{const c=C.ch[C.cs]||dia(0,0);ph();C.ch[C.cs]={r:c.r,q};cDraw();csave()}));
  add('なし',()=>{ph();C.ch[C.cs]=null;cDraw();csave()});
}
function cPrev(m){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();piano(m,ctx.currentTime,.5,.9)}
/* --- ロールの操作: タップで追加 / ドラッグで移動 / 右端で長さ / 空白ドラッグでスクロール --- */
const hit=(x,y)=>{const m=HI-Math.floor(y/RH);let r=-1;C.cn.forEach((n,i)=>{if(n.m===m&&x>=n.b*C.px-6&&x<=(n.b+n.l)*C.px+6)r=i});return r};
RL.onpointerdown=e=>{
  const r=RL.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,sn=C.cn[C.sel];let hm=0;if(sn){const yy=(HI-sn.m)*RH;if(y>=yy-6&&y<=yy+RH+6){if(Math.abs(x-(sn.b+sn.l)*C.px)<=16)hm=1;else if(Math.abs(x-sn.b*C.px)<=16)hm=2}}
  const i=hm?C.sel:hit(x,y);C.sel=i;RL.setPointerCapture(e.pointerId);
  if(i>=0){const n=C.cn[i];dg={i,x:e.clientX,y:e.clientY,m:n.m,b:n.b,l:n.l,hm,s0:snap()};if(!hm)cPrev(n.m)}
  else dg={pan:1,x:e.clientX,y:e.clientY,sl:SC.scrollLeft,st:SC.scrollTop,cx:x,cy:y,mv:0};
  cDraw();
};
RL.onpointermove=e=>{
  if(!dg)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;
  if(dg.pan){if(Math.abs(dx)+Math.abs(dy)>6)dg.mv=1;if(dg.mv){SC.scrollLeft=dg.sl-dx;SC.scrollTop=dg.st-dy}return}
  const n=C.cn[dg.i],fq=$('csnap').checked?C.g:1/64,db=dx/C.px,sq=v=>Math.round(v/fq)*fq;
  if(dg.hm===1)n.l=Math.max(1/32,sq(dg.b+dg.l+db)-dg.b);
  else if(dg.hm===2){const nb=clamp(sq(dg.b+db),0,dg.b+dg.l-1/32);n.l=dg.b+dg.l-nb;n.b=nb}
  else{n.b=Math.max(0,sq(dg.b+db));const m=clamp(dg.m+Math.round(-dy/RH),LO,HI);if(m!==n.m){n.m=m;cPrev(m)}}
  cDraw();
};
RL.onpointerup=RL.onpointercancel=()=>{
  if(!dg)return;const d=dg;dg=null;
  if(d.pan){
    if(!d.mv){ph();const nn={m:HI-Math.floor(d.cy/RH),b:Math.floor(d.cx/C.px/C.g)*C.g,l:C.nl};C.cn.push(nn);C.cur=nn.b+C.nl;cPrev(nn.m);fix();C.sel=C.cn.indexOf(nn)}
  }else{const n=C.cn[d.i];if(d.hm)C.nl=n.l;if(snap()!==d.s0){C.hist.push(d.s0);C.redo=[]}fix();C.sel=C.cn.indexOf(n)}
  cDraw();csave();
};
$('cchord').onclick=e=>{const b=Math.floor((e.clientX-$('cchord').getBoundingClientRect().left)/(C.px*4));if(b<C.bars){C.cs=b;C.cur=b*4;cDraw();cPan()}};
/* --- 鍵盤 --- */
function cKb(){
  const k=$('ckb'),W=100/14;let wi=0;k.innerHTML='';
  for(let o=0;o<2;o++)for(let pc=0;pc<12;pc++){
    const m=C.kb+o*12+pc,w=MAJS.includes(pc),el=document.createElement(w?'b':'i');el.dataset.m=m;
    if(w){el.style.left=wi*W+'%';el.style.width=W+'%';el.textContent=pc?'':'C'+(m/12-1);wi++}
    else{el.style.left=(wi*W-W*.3)+'%';el.style.width=W*.6+'%'}
    k.appendChild(el);
  }
}
$('ckb').onpointerdown=e=>{
  const m=+e.target.dataset.m;if(!m)return;cPrev(m);
  if($('cinp').checked){ph();const nn={m,b:C.cur,l:C.nl};C.cn.push(nn);C.cur+=C.nl;fix();C.sel=C.cn.indexOf(nn);cDraw();csave();SC.scrollLeft=Math.max(0,C.cur*C.px-SC.clientWidth/2)}
};
$('cup').onclick=()=>{C.kb=Math.min(72,C.kb+12);cKb()};$('cdn').onclick=()=>{C.kb=Math.max(36,C.kb-12);cKb()};
/* --- 再生 --- */
function clk(t,a){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=a?1500:1000;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g).connect(cbus);o.start(t);o.stop(t+.06)}
function acc(c,t,spb,st){
  const m0=48+c.r,tn=QI[c.q].map(i=>m0+i);
  if(st==='b')[0,2].forEach(k=>tn.forEach(m=>piano(m,t+k*spb,spb*1.9,.32)));
  else if(st==='a'){const at=[...tn,tn[0]+12];[0,1,2,1,3,1,2,1].forEach((p,k)=>piano(at[p],t+k*spb/2,spb*1.2,.32))}
  else{[0,2].forEach(k=>piano(m0-12,t+k*spb,spb*1.8,.5));for(let k=0;k<8;k++)tn.slice(1,3).forEach(m=>piano(m,t+k*spb/2,spb*.45,k%2?.18:.26))}
}
function cSched(t0,b0,b1){
  const spb=60/C.bpm;
  if($('cm').checked)C.cn.forEach(n=>{if(n.b>=b0&&n.b<b1)piano(n.m,t0+(n.b-b0)*spb,n.l*spb,.9)});
  if($('cc').checked)for(let b=b0/4;b<b1/4;b++){const c=C.ch[b];if(c)acc(c,t0+(b*4-b0)*spb,spb,$('cstyle').value)}
  if($('cmet').checked)for(let b=Math.ceil(b0);b<b1;b++)clk(t0+(b-b0)*spb,b%4===0);
  if($('cv').checked&&voiceBuf&&C.bpm===C.vbpm){const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=voiceBuf;g.gain.value=.9;s.connect(g).connect(cbus);s.start(t0,Math.min(b0*spb,voiceBuf.duration-.01),(b1-b0)*spb)}
  return (b1-b0)*spb;
}
function tick(){if(!P)return;const x=(P.b0+Math.max(0,ctx.currentTime-P.t0)/(60/C.bpm))*C.px;$('cph').style.left=x+'px';if(x<SC.scrollLeft||x>SC.scrollLeft+SC.clientWidth-30)SC.scrollLeft=Math.max(0,x-40);requestAnimationFrame(tick)}
function cStop(){if(P){clearTimeout(P.tm);P=null}if(cbus){try{cbus.disconnect()}catch(e){}cbus=null}pdest=null;$('cplay').textContent='▶ 再生';$('cph').style.display='none'}
$('cplay').onclick=()=>{
  if(P){cStop();return}
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
  cbus=ctx.createGain();cbus.connect(ctx.destination);pdest=cbus;
  const b0=Math.max(0,(+$('clb0').value||1)-1)*4,b1=Math.min(C.bars,+$('clb1').value||C.bars)*4;
  if(b1<=b0){cStop();return}
  P={b0,t0:0};
  const go=t0=>{P.t0=t0;const d=cSched(t0,b0,b1),lp=$('cloop').checked;P.tm=setTimeout(()=>{if(!P)return;if($('cloop').checked)go(t0+d);else cStop()},Math.max(0,(t0+d-ctx.currentTime)*1000+(lp?-60:600)))};
  go(ctx.currentTime+.1);$('cplay').textContent='■ 停止';$('cph').style.display='block';tick();
};
/* --- ボタン類 --- */
$('tocomp').onclick=()=>{$('comp').classList.add('on');document.body.style.overflow='hidden';if(!C.cn.length)cImport();else cSync(1)};
$('cback').onclick=()=>{cStop();$('comp').classList.remove('on');document.body.style.overflow=''};
$('creimp').onclick=()=>{if(confirm('作曲モードでの編集内容は上書きされます。録音から取り込み直しますか?'))cImport()};
$('cbpm').onchange=()=>{C.bpm=clamp(+$('cbpm').value||100,40,240);cSync()};
$('ckey').onchange=()=>{const v=+$('ckey').value;C.t=v>>1;C.mn=v&1;cDraw();cPan();csave()};
$('cgrid').onchange=()=>{C.g=+$('cgrid').value;cDraw()};
$('czoom').oninput=()=>{C.px=+$('czoom').value;cDraw()};
$('cadd').onclick=()=>{ph();C.bars++;C.ch.push(null);cDraw();csave()};
$('cq').onclick=()=>{ph();C.cn.forEach(n=>{const e=Math.round((n.b+n.l)/C.g)*C.g;n.b=Math.round(n.b/C.g)*C.g;n.l=Math.max(C.g,e-n.b)});fix();C.sel=-1;cDraw();csave()};
$('csn').onclick=()=>{
  ph();const sc=scPc();
  C.cn.forEach(n=>{if(sc.includes(n.m%12))return;for(let d=1;d<4;d++){if(sc.includes((n.m-d+120)%12)){n.m-=d;return}if(sc.includes((n.m+d)%12)){n.m+=d;return}}});
  cDraw();csave();
};
$('csug').onclick=()=>{ph();suggest();cDraw();cPan();csave()};
$('cmode').onchange=cPan;
$('cdel').onclick=()=>{if(C.sel<0)return;ph();C.cn.splice(C.sel,1);C.sel=-1;cDraw();csave()};
$('cun').onclick=()=>{if(!C.hist.length)return;C.redo.push(snap());rest(C.hist.pop())};
$('cre').onclick=()=>{if(!C.redo.length)return;C.hist.push(snap());rest(C.redo.pop())};
for(let k=0;k<2;k++)for(let t=0;t<12;t++)$('ckey').insertAdjacentHTML('beforeend','<option value="'+(t*2+k)+'">'+EN[t]+(k?'m(短調)':'(長調)')+'</option>');
cKb();
</script>
</body>
</html>
